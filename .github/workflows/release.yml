name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_USERCONFIG: /tmp/aihu-server-npmrc-oidc-only
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - name: Prepare OIDC-only npm config
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - name: Pin npm for trusted publishing
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Reject classic npm authentication
        run: node scripts/check-oidc-auth.mjs
      - name: Verify tag and platform pins
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run check:release-version "$RELEASE_TAG"
          bun run check:platform-pins
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "${{ github.sha }}"
      - name: Bind release to merged default branch
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
      - name: Verify reviewed merged release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/assert-reviewed-release.mjs

  build-native:
    name: Build ${{ matrix.target }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        # These are the four targets represented by the published optional
        # dependencies. Keep this list synchronized with check-platform-pins.
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            package: darwin-arm64
            cdylib: libaihu_server_native.dylib
            binary: server-native.darwin-arm64.node
          - target: x86_64-apple-darwin
            runner: macos-14
            package: darwin-x64
            cdylib: libaihu_server_native.dylib
            binary: server-native.darwin-x64.node
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            package: linux-x64-gnu
            cdylib: libaihu_server_native.so
            binary: server-native.linux-x64-gnu.node
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            package: win32-x64-msvc
            cdylib: aihu_server_native.dll
            binary: server-native.win32-x64-msvc.node
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:release-contract
      - name: Verify platform pins
        run: bun run check:platform-pins
      - name: Build native addon
        run: cargo build --manifest-path src-native/Cargo.toml --release --target ${{ matrix.target }}
      - name: Stage native addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "npm/${{ matrix.package }}"
          source_path="src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}"
          test -s "$source_path"
          cp "$source_path" "npm/${{ matrix.package }}/${{ matrix.binary }}"
          test -s "npm/${{ matrix.package }}/${{ matrix.binary }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.package }}
          path: npm/${{ matrix.package }}/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  publish-native:
    name: Publish ${{ matrix.package }}
    needs: build-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      NPM_CONFIG_USERCONFIG: .npmrc
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: darwin-arm64
            binary: server-native.darwin-arm64.node
            runner: macos-14
            os: darwin
            cpu: arm64
          - package: darwin-x64
            binary: server-native.darwin-x64.node
            runner: macos-15-intel
            os: darwin
            cpu: x64
          - package: linux-x64-gnu
            binary: server-native.linux-x64-gnu.node
            runner: ubuntu-22.04
            os: linux
            cpu: x64
            libc: glibc
          - package: win32-x64-msvc
            binary: server-native.win32-x64-msvc.node
            runner: windows-2022
            os: win32
            cpu: x64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-${{ matrix.package }}
          path: npm/${{ matrix.package }}
      - name: Validate downloaded addon
        shell: bash
        working-directory: npm/${{ matrix.package }}
        run: |
          set -euo pipefail
          test -s "${{ matrix.binary }}"
          test "$(node -p "require('./package.json').name")" = "@aihu/server-${{ matrix.package }}"
          test "$(node -p "require('./package.json').main")" = "${{ matrix.binary }}"
          test "$(node -p "JSON.stringify(require('./package.json').os)")" = '["${{ matrix.os }}"]'
          test "$(node -p "JSON.stringify(require('./package.json').cpu)")" = '["${{ matrix.cpu }}"]'
          if [ -n "${{ matrix.libc || '' }}" ]; then test "$(node -p "JSON.stringify(require('./package.json').libc)")" = '["${{ matrix.libc }}"]'; fi
      - name: Prepare OIDC-only npm config
        shell: bash
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - name: Pin npm for trusted publishing
        shell: bash
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Reject classic npm authentication
        shell: bash
        run: node scripts/check-oidc-auth.mjs
      - name: Pack, consume, and publish exact native tarball
        shell: bash
        run: |
          set -euo pipefail
          root="npm/${{ matrix.package }}"
          package_name="$(node -p "require('./$root/package.json').name")"
          pack_dir="$RUNNER_TEMP/server-native-pack-${{ matrix.package }}"
          mkdir -p "$pack_dir"
          PACK_DIR="$pack_dir" node scripts/verify-pack.mjs "$root"
          pack_path="$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$pack_dir")"
          consumer="$(mktemp -d)"
          (cd "$consumer" && npm init -y >/dev/null && npm install --ignore-scripts --no-package-lock --no-audit --no-fund "$pack_path" >/dev/null)
          test -s "$consumer/node_modules/$package_name/${{ matrix.binary }}"
          node scripts/assert-unpublished.mjs "$root"
          npm publish "$pack_path" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"

  publish-host:
    name: Publish @aihu/server
    needs: [validate-release, publish-native]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Prepare OIDC-only npm config
        run: printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
      - name: Pin npm for trusted publishing
        run: npm install --global npm@11.5.1 --ignore-scripts
      - name: Reject classic npm authentication
        run: node scripts/check-oidc-auth.mjs
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:release-contract
      - name: Verify release metadata and build host package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run check:release-version "$RELEASE_TAG"
          bun run check:platform-pins
          bun run build
      - name: Confirm registry returns E404 only
        run: node scripts/assert-unpublished.mjs
      - name: Capture and validate one exact tarball
        env:
          PACK_DIR: ${{ runner.temp }}/aihu-server-pack
        run: node scripts/verify-pack.mjs
      - name: Validate isolated consumer
        run: node scripts/consumer-smoke.mjs "$AIHU_PACK_PATH"
      - name: Publish exact validated tarball with OIDC provenance
        run: npm publish "$AIHU_PACK_PATH" --access public --provenance --registry "$NPM_CONFIG_REGISTRY"
